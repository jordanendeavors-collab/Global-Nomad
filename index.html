<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c0c0c" />
  <meta name="description" content="Global Travel Discovery - Complete Planning for 300+ Destinations" />
  <title>Global Travel Discovery | Complete Concierge</title>
  <style>
    :root {
      --gold: #d4af37;
      --gold-dark: #b8860b;
      --bg-primary: #0c0c0c;
      --bg-secondary: #1a1a2e;
      --bg-tertiary: #16213e;
      --text-primary: #f5f5f5;
      --text-secondary: #888;
      --text-muted: #666;
      --success: #22c55e;
      --warning: #eab308;
      --danger: #ef4444;
      --ferrari: #c00000;
      --star3: #cd7f32;
      --star4: #c0c0c0;
      --star5: #ffd700;
    }
    
    @font-face {
      font-family: 'Cormorant';
      font-style: normal;
      font-weight: 300 600;
      src: local('Cormorant Garamond'), local('Georgia'), local('serif');
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      min-height: 100vh;
      background: linear-gradient(145deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-tertiary) 100%);
      color: var(--text-primary);
      font-family: 'Cormorant', Georgia, serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }
    
    button, input, select { font-family: inherit; cursor: pointer; }
    
    header {
      padding: 1.5rem 1.5rem 1rem;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      background: linear-gradient(180deg, rgba(212, 175, 55, 0.08) 0%, rgba(12, 12, 12, 1) 100%);
    }
    
    .header-inner { max-width: 1400px; margin: 0 auto; }
    
    .header-badge {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }
    
    .header-badge .icon { font-size: 1.5rem; }
    .header-badge .label {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: var(--gold);
      font-weight: 600;
      text-transform: uppercase;
    }
    
    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    
    h1 em { font-style: italic; color: var(--gold); }
    
    .header-stats {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 0.75rem;
      letter-spacing: 0.02em;
    }
    
    .controls {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 99;
      background: linear-gradient(180deg, rgba(12, 12, 12, 0.98) 0%, rgba(26, 26, 46, 0.98) 100%);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
    }
    
    .search-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    
    .search-input {
      flex: 1;
      min-width: 200px;
      padding: 0.875rem 1.25rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }
    
    .search-input:focus { border-color: var(--gold); }
    .search-input::placeholder { color: var(--text-muted); }
    
    .region-select {
      padding: 0.875rem 1.25rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 4px;
      color: var(--text-primary);
      font-size: 0.9rem;
      min-width: 180px;
    }
    
    .region-select option { background: var(--bg-primary); color: var(--text-primary); }
    
    .month-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    
    .month-btn {
      padding: 0.5rem 0.875rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      color: #ccc;
      font-size: 0.85rem;
      border-radius: 3px;
      transition: all 0.2s;
    }
    
    .month-btn:hover { border-color: rgba(212, 175, 55, 0.5); }
    
    .month-btn.active {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      border-color: var(--gold);
      color: var(--bg-primary);
      font-weight: 600;
    }
    
    .section-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      font-weight: 600;
    }
    
    .results-info {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }
    
    .dest-grid {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 1.5rem 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }
    
    .dest-card {
      padding: 1.25rem;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
    }
    
    .dest-card:hover {
      background: rgba(255,255,255,0.04);
      border-color: rgba(212, 175, 55, 0.3);
      transform: translateY(-2px);
    }
    
    .dest-card.expanded {
      grid-column: 1 / -1;
      max-width: 100%;
    }
    
    .dest-header {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }
    
    .dest-emoji { font-size: 1.75rem; }
    
    .dest-name {
      font-size: 1.4rem;
      font-weight: 400;
      line-height: 1.2;
    }
    
    .dest-location {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }
    
    .month-indicator {
      display: flex;
      gap: 2px;
      margin: 0.75rem 0;
    }
    
    .month-dot {
      width: 20px;
      height: 4px;
      border-radius: 2px;
      background: var(--text-muted);
      opacity: 0.3;
    }
    
    .month-dot.best { background: var(--success); opacity: 1; }
    .month-dot.worst { background: var(--danger); opacity: 0.8; }
    .month-dot.current { box-shadow: 0 0 6px var(--gold); }
    
    .dest-highlight {
      font-size: 0.9rem;
      color: var(--text-secondary);
      font-style: italic;
      margin-bottom: 0.5rem;
    }
    
    /* Expanded Card Details */
    .dest-details {
      display: none;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
    }
    
    .dest-card.expanded .dest-details { display: block; }
    
    .detail-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    
    .detail-tab {
      padding: 0.5rem 1rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-radius: 3px;
      transition: all 0.2s;
    }
    
    .detail-tab:hover { border-color: rgba(212, 175, 55, 0.5); color: var(--text-primary); }
    .detail-tab.active { background: var(--gold); color: var(--bg-primary); font-weight: 600; border-color: var(--gold); }
    
    .detail-panel { display: none; }
    .detail-panel.active { display: block; }
    
    .detail-section {
      margin-bottom: 1.5rem;
    }
    
    .detail-section h4 {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      font-weight: 600;
    }
    
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    
    .detail-item {
      padding: 0.75rem;
      background: rgba(0,0,0,0.2);
      border-radius: 4px;
      border-left: 3px solid var(--gold);
    }
    
    .detail-item.star-3 { border-left-color: var(--star3); }
    .detail-item.star-4 { border-left-color: var(--star4); }
    .detail-item.star-5 { border-left-color: var(--star5); }
    
    .detail-item-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.25rem;
    }
    
    .detail-item-value {
      font-size: 1rem;
      color: var(--text-primary);
    }
    
    .detail-item-note {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }
    
    .star-rating {
      color: var(--gold);
      font-size: 0.8rem;
      margin-left: 0.5rem;
    }
    
    .weather-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
    }
    
    .weather-item {
      text-align: center;
      padding: 0.75rem;
      background: rgba(0,0,0,0.2);
      border-radius: 4px;
    }
    
    .weather-season {
      font-size: 0.7rem;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.25rem;
    }
    
    .weather-temp { font-size: 1rem; font-weight: 600; }
    .weather-desc { font-size: 0.8rem; color: var(--text-secondary); }
    
    .tradition-item {
      padding: 1rem;
      background: rgba(0,0,0,0.2);
      border-radius: 4px;
      margin-bottom: 0.75rem;
    }
    
    .tradition-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 0.25rem;
    }
    
    .tradition-desc {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    
    .activity-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
    }
    
    .activity-item {
      padding: 0.75rem;
      background: rgba(0,0,0,0.2);
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .activity-icon { font-size: 1.25rem; }
    .activity-name { font-size: 0.9rem; }
    
    .booking-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    
    .booking-link {
      padding: 0.5rem 1rem;
      background: linear-gradient(135deg, var(--ferrari) 0%, #8b0000 100%);
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    
    .booking-link:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(192, 0, 0, 0.4);
    }
    
    .cruise-item {
      padding: 0.75rem;
      background: rgba(0,0,0,0.2);
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }
    
    .cruise-line {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .cruise-route {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    
    .cruise-price {
      font-size: 0.85rem;
      color: var(--gold);
      margin-top: 0.25rem;
    }
    
    footer {
      padding: 2rem;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.05);
      margin-top: 2rem;
    }
    
    .footer-text {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }
    
    @media (max-width: 768px) {
      .weather-grid { grid-template-columns: repeat(2, 1fr); }
      .detail-grid { grid-template-columns: 1fr; }
      .dest-card.expanded { padding: 1rem; }
    }
  </style>
</head>

// APPLICATION LOGIC
// ============================================================
const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
let currentMonth = new Date().getMonth() + 1;
let searchQuery = '';
let selectedRegion = 'all';
let expandedId = null;
let activeTab = 'overview';

document.addEventListener('DOMContentLoaded', init);

function init() {
  renderMonths();
  renderDestinations();
  updateStats();
  document.getElementById('searchInput').addEventListener('input', (e) => { searchQuery = e.target.value.toLowerCase(); renderDestinations(); });
  document.getElementById('regionSelect').addEventListener('change', (e) => { selectedRegion = e.target.value; renderDestinations(); });
}

function renderMonths() {
  document.getElementById('monthRow').innerHTML = months.map((m, i) => 
    `<button class="month-btn${currentMonth === i+1 ? ' active' : ''}" onclick="setMonth(${i+1})">${m}</button>`
  ).join('');
}

function setMonth(m) {
  currentMonth = m;
  renderMonths();
  renderDestinations();
}

function updateStats() {
  const total = destinations.length;
  const regions = [...new Set(destinations.map(d => d.region))].length;
  document.getElementById('headerStats').textContent = `${total} Destinations • ${regions} Regions • Complete Travel Intelligence`;
}

function filterDestinations() {
  return destinations.filter(d => {
    const matchesSearch = !searchQuery || 
      d.name.toLowerCase().includes(searchQuery) ||
      d.state.toLowerCase().includes(searchQuery) ||
      d.country.toLowerCase().includes(searchQuery) ||
      d.highlights.toLowerCase().includes(searchQuery);
    const matchesRegion = selectedRegion === 'all' || d.region === selectedRegion;
    return matchesSearch && matchesRegion;
  }).sort((a,b) => {
    const aScore = a.bestMonths.includes(currentMonth) ? 2 : (a.worstMonths.includes(currentMonth) ? 0 : 1);
    const bScore = b.bestMonths.includes(currentMonth) ? 2 : (b.worstMonths.includes(currentMonth) ? 0 : 1);
    return bScore - aScore;
  });
}

function renderDestinations() {
  const filtered = filterDestinations();
  document.getElementById('resultsInfo').textContent = `Showing ${filtered.length} destinations${currentMonth ? ` optimized for ${months[currentMonth-1]}` : ''}`;
  document.getElementById('destGrid').innerHTML = filtered.map(d => renderCard(d)).join('');
}

function renderCard(d) {
  const isExpanded = expandedId === d.id;
  const monthIndicators = Array(12).fill(0).map((_, i) => {
    const m = i + 1;
    let cls = 'month-dot';
    if (d.bestMonths.includes(m)) cls += ' best';
    else if (d.worstMonths.includes(m)) cls += ' worst';
    if (m === currentMonth) cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');
  
  return `
    <div class="dest-card${isExpanded ? ' expanded' : ''}" onclick="toggleCard('${d.id}')">
      <div class="dest-header">
        <span class="dest-emoji">${d.emoji}</span>
        <div>
          <div class="dest-name">${d.name}</div>
          <div class="dest-location">${d.state}, ${d.country}</div>
        </div>
      </div>
      <div class="month-indicator">${monthIndicators}</div>
      <div class="dest-highlight">${d.highlights}</div>
      ${isExpanded ? renderExpandedDetails(d) : ''}
    </div>
  `;
}

function toggleCard(id) {
  expandedId = expandedId === id ? null : id;
  activeTab = 'overview';
  renderDestinations();
}

function setTab(tab, event) {
  event.stopPropagation();
  activeTab = tab;
  renderDestinations();
}

function renderExpandedDetails(d) {
  const tabs = ['overview', 'hotels', 'dining', 'activities', 'cruises', 'traditions'];
  const tabLabels = { overview: '📋 Overview', hotels: '🏨 Hotels', dining: '🍽️ Dining', activities: '🎯 Activities', cruises: '🚢 Cruises', traditions: '🎭 Traditions' };
  
  return `
    <div class="dest-details">
      <div class="detail-tabs">
        ${tabs.map(t => `<button class="detail-tab${activeTab === t ? ' active' : ''}" onclick="setTab('${t}', event)">${tabLabels[t]}</button>`).join('')}
      </div>
      ${activeTab === 'overview' ? renderOverview(d) : ''}
      ${activeTab === 'hotels' ? renderHotels(d) : ''}
      ${activeTab === 'dining' ? renderDining(d) : ''}
      ${activeTab === 'activities' ? renderActivities(d) : ''}
      ${activeTab === 'cruises' ? renderCruises(d) : ''}
      ${activeTab === 'traditions' ? renderTraditions(d) : ''}
    </div>
  `;
}

function renderOverview(d) {
  return `
    <div class="detail-panel active">
      <div class="detail-section">
        <h4>Weather by Season</h4>
        <div class="weather-grid">
          ${Object.entries(d.weather).map(([season, info]) => `
            <div class="weather-item">
              <div class="weather-season">${season}</div>
              <div class="weather-temp">${info.split(',')[0]}</div>
              <div class="weather-desc">${info.split(',')[1] || ''}</div>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="detail-section">
        <h4>Key Events</h4>
        <div class="detail-item">
          <div class="detail-item-value">${d.events}</div>
        </div>
      </div>
      <div class="detail-section">
        <h4>Flights</h4>
        <div class="detail-grid">
          <div class="detail-item">
            <div class="detail-item-label">Peak Season</div>
            <div class="detail-item-value">${d.flights.peak}</div>
          </div>
          <div class="detail-item">
            <div class="detail-item-label">Off Season</div>
            <div class="detail-item-value">${d.flights.off}</div>
          </div>
        </div>
        <div class="detail-item" style="margin-top: 0.5rem;">
          <div class="detail-item-label">Major Carriers</div>
          <div class="detail-item-value">${d.flights.carriers.join(' • ')}</div>
        </div>
      </div>
      <div class="booking-links">
        <a href="https://www.google.com/flights?q=${encodeURIComponent(d.name)}" target="_blank" class="booking-link">Google Flights</a>
        <a href="https://www.kayak.com/flights/-${d.name.replace(/\s/g, '')}" target="_blank" class="booking-link">Kayak</a>
        <a href="https://www.booking.com/searchresults.html?ss=${encodeURIComponent(d.name)}" target="_blank" class="booking-link">Hotels</a>
        <a href="https://www.tripadvisor.com/Search?q=${encodeURIComponent(d.name)}" target="_blank" class="booking-link">TripAdvisor</a>
      </div>
    </div>
  `;
}

function renderHotels(d) {
  const renderTier = (tier, label, star) => {
    if (!d.hotels[tier] || d.hotels[tier].length === 0) return '';
    return `
      <div class="detail-section">
        <h4>${star} ${label}</h4>
        <div class="detail-grid">
          ${d.hotels[tier].map(h => `
            <div class="detail-item ${tier}">
              <div class="detail-item-label">${h.price}</div>
              <div class="detail-item-value">${h.name}</div>
              <div class="detail-item-note">${h.note}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  };
  
  return `
    <div class="detail-panel active">
      ${renderTier('star5', '5-Star Luxury', '⭐⭐⭐⭐⭐')}
      ${renderTier('star4', '4-Star Upscale', '⭐⭐⭐⭐')}
      ${renderTier('star3', '3-Star Value', '⭐⭐⭐')}
      <div class="booking-links">
        <a href="https://www.booking.com/searchresults.html?ss=${encodeURIComponent(d.name)}" target="_blank" class="booking-link">Booking.com</a>
        <a href="https://www.hotels.com/Hotel-Search?destination=${encodeURIComponent(d.name)}" target="_blank" class="booking-link">Hotels.com</a>
        <a href="https://www.expedia.com/Hotel-Search?destination=${encodeURIComponent(d.name)}" target="_blank" class="booking-link">Expedia</a>
        <a href="https://www.airbnb.com/s/${encodeURIComponent(d.name)}" target="_blank" class="booking-link">Airbnb</a>
      </div>
    </div>
  `;
}

function renderDining(d) {
  const renderTier = (tier, label, stars) => {
    if (!d.eateries[tier] || d.eateries[tier].length === 0) return '';
    return `
      <div class="detail-section">
        <h4>${stars} ${label}</h4>
        <div class="detail-grid">
          ${d.eateries[tier].map(e => `
            <div class="detail-item ${tier}">
              <div class="detail-item-label">${e.cuisine} • ${e.price}</div>
              <div class="detail-item-value">${e.name}</div>
              <div class="detail-item-note">${e.note}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  };
  
  return `
    <div class="detail-panel active">
      ${renderTier('star5', '5-Star Fine Dining', '⭐⭐⭐⭐⭐')}
      ${renderTier('star4', '4-Star Upscale', '⭐⭐⭐⭐')}
      ${renderTier('star3', '3-Star Casual', '⭐⭐⭐')}
      <div class="booking-links">
        <a href="https://www.opentable.com/s?term=${encodeURIComponent(d.name)}" target="_blank" class="booking-link">OpenTable</a>
        <a href="https://www.yelp.com/search?find_loc=${encodeURIComponent(d.name)}&find_desc=restaurants" target="_blank" class="booking-link">Yelp</a>
        <a href="https://www.tripadvisor.com/Restaurants-g${d.name.replace(/\s/g, '')}" target="_blank" class="booking-link">TripAdvisor</a>
        <a href="https://guide.michelin.com/en/search?query=${encodeURIComponent(d.name)}" target="_blank" class="booking-link">Michelin Guide</a>
      </div>
    </div>
  `;
}

function renderActivities(d) {
  return `
    <div class="detail-panel active">
      <div class="detail-section">
        <h4>Top Activities & Attractions</h4>
        <div class="activity-list">
          ${d.activities.map(a => `
            <div class="activity-item">
              <span class="activity-icon">${a.icon}</span>
              <span class="activity-name">${a.name}</span>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="booking-links">
        <a href="https://www.viator.com/searchResults/all?text=${encodeURIComponent(d.name)}" target="_blank" class="booking-link">Viator Tours</a>
        <a href="https://www.getyourguide.com/s/?q=${encodeURIComponent(d.name)}" target="_blank" class="booking-link">GetYourGuide</a>
        <a href="https://www.tripadvisor.com/Attractions-g${d.name.replace(/\s/g, '')}" target="_blank" class="booking-link">TripAdvisor Things to Do</a>
        <a href="https://www.klook.com/search/?keyword=${encodeURIComponent(d.name)}" target="_blank" class="booking-link">Klook</a>
      </div>
    </div>
  `;
}

function renderCruises(d) {
  if (!d.cruises || d.cruises.length === 0) {
    return `
      <div class="detail-panel active">
        <div class="detail-section">
          <h4>Cruise Information</h4>
          <div class="detail-item">
            <div class="detail-item-value">No major cruise routes departing from ${d.name}</div>
            <div class="detail-item-note">This destination is primarily accessed by air travel</div>
          </div>
        </div>
      </div>
    `;
  }
  
  return `
    <div class="detail-panel active">
      <div class="detail-section">
        <h4>Available Cruise Routes</h4>
        ${d.cruises.map(c => `
          <div class="cruise-item">
            <div class="cruise-line">${c.line}</div>
            <div class="cruise-route">${c.route} • ${c.duration}</div>
            <div class="cruise-price">${c.price}</div>
          </div>
        `).join('')}
      </div>
      <div class="booking-links">
        <a href="https://www.cruisecritic.com/search/?keyword=${encodeURIComponent(d.name)}" target="_blank" class="booking-link">Cruise Critic</a>
        <a href="https://www.vacationstogo.com/" target="_blank" class="booking-link">Vacations To Go</a>
        <a href="https://www.royalcaribbean.com/" target="_blank" class="booking-link">Royal Caribbean</a>
        <a href="https://www.princess.com/" target="_blank" class="booking-link">Princess Cruises</a>
      </div>
    </div>
  `;
}

function renderTraditions(d) {
  return `
    <div class="detail-panel active">
      <div class="detail-section">
        <h4>Local Traditions & Culture</h4>
        ${d.traditions.map(t => `
          <div class="tradition-item">
            <div class="tradition-name">${t.name}</div>
            <div class="tradition-desc">${t.desc}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}
</script>
</body>
</html>
